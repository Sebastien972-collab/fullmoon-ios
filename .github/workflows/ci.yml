# Created by Sébastien DAGUIN
name: Swift CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: ./scripts/lint.sh

  build:
    name: macOS and iOS build
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fullmoon-ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: fullmoon-ios
          persist-credentials: false
      - name: Check out the local Noctis package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Sebastien972-collab/NoctisAi
          ref: d28b2af6b10836bb50427a70adb3007acc43b30d
          path: NoctisAi
          persist-credentials: false
      - name: Check toolchain and prepare Metal
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          xcodebuild -downloadComponent MetalToolchain
      - name: Install runtime preparation tools
        run: brew install uv
      - name: Prepare the macOS SearXNG runtime
        run: python3 ../NoctisAi/infrastructure/searxng/setup_runtime.py --standalone --destination build/SearXNG
      - name: Build macOS
        run: >-
          xcodebuild -project fullmoon.xcodeproj -scheme fullmoon
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData -skipPackageUpdates
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Prepare the iOS SearXNG runtime
        run: >-
          build/SearXNG/python/bin/python3 ../NoctisAi/infrastructure/searxng/setup_ios_runtime.py
          --mac-runtime build/SearXNG --destination build/SearXNG-iOS
      - name: Build iOS Simulator
        run: >-
          xcodebuild -project fullmoon.xcodeproj -scheme fullmoon
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData -skipPackageUpdates
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

# Created by Sébastien DAGUIN
name: Swift CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: ./scripts/lint.sh

  package-resolution:
    name: Swift package resolution
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve package dependencies
        run: |
          resolution_options=()
          if [ -f fullmoon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved ]; then
            resolution_options+=(-onlyUsePackageVersionsFromResolvedFile)
          fi
          xcodebuild -resolvePackageDependencies -project fullmoon.xcodeproj -scheme fullmoon \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipMacroValidation -skipPackagePluginValidation "${resolution_options[@]}"
      - name: Verify the committed package lock
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          path = "fullmoon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          resolved = json.loads(Path(path).read_text())
          print("PACKAGE_RESOLVED_JSON=" + json.dumps(resolved, separators=(",", ":")), flush=True)
          committed = subprocess.run(["git", "show", "HEAD:" + path], capture_output=True, text=True)
          if committed.returncode:
              raise SystemExit("Commit the Package.resolved generated by Xcode before building the app.")
          if json.loads(committed.stdout) != resolved:
              raise SystemExit("Package.resolved changed during resolution; regenerate and commit it.")
          PY

  build:
    name: macOS and iOS build
    needs: package-resolution
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fullmoon-ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: fullmoon-ios
          persist-credentials: false
      - name: Read the locked Noctis revision
        id: noctis
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          path = "fullmoon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          pins = [pin for pin in json.loads(Path(path).read_text())["pins"] if pin["identity"] == "noctisai"]
          if len(pins) != 1 or not re.fullmatch(r"[0-9a-f]{40}", pins[0]["state"]["revision"]):
              raise SystemExit("Package.resolved must contain one valid NoctisAi revision.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("revision=" + pins[0]["state"]["revision"] + "\n")
          PY
      - name: Check out the local Noctis package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Sebastien972-collab/NoctisAi
          ref: ${{ steps.noctis.outputs.revision }}
          path: NoctisAi
          persist-credentials: false
      - name: Check toolchain and prepare Metal
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          xcodebuild -downloadComponent MetalToolchain
      - name: Test activity history and conversation persistence
        run: |
          ./scripts/test-response-activity.sh
          ./scripts/test-identity.sh
      - name: Install runtime preparation tools
        run: brew install uv
      - name: Prepare the macOS SearXNG runtime
        run: python3 ../NoctisAi/infrastructure/searxng/setup_runtime.py --standalone --destination build/SearXNG
      - name: Build macOS
        run: >-
          xcodebuild -quiet -project fullmoon.xcodeproj -scheme fullmoon
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData -skipPackageUpdates -skipMacroValidation
          -skipPackagePluginValidation
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Prepare the iOS SearXNG runtime
        run: >-
          build/SearXNG/python/bin/python3 ../NoctisAi/infrastructure/searxng/setup_ios_runtime.py
          --mac-runtime build/SearXNG --destination build/SearXNG-iOS
      - name: Build iOS Simulator
        run: >-
          xcodebuild -quiet -project fullmoon.xcodeproj -scheme fullmoon
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData -skipPackageUpdates -skipMacroValidation
          -skipPackagePluginValidation
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Capture the compiled iOS interface
        id: capture_ios
        timeout-minutes: 10
        run: ./scripts/capture-ios-interface.sh
      - name: Upload iOS interface captures
        if: ${{ always() && steps.capture_ios.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-interface-${{ github.sha }}
          path: fullmoon-ios/build/interface-captures
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
